<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Chicago Crime Analytics
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Application CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body class="app-body">


<!-- =====================================================
     Navigation Bar
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark app-navbar">

    <div class="container">


        <!-- Brand -->

        <a
            class="navbar-brand app-brand"
            href="{{ url_for('main.dashboard') }}"
        >

            <span class="brand-icon">
                C
            </span>

            <span>
                Chicago Crime Analytics
            </span>

        </a>


        <!-- Navigation -->

        <div class="navbar-nav app-navigation">


            <!-- Dashboard -->

            <a
                class="nav-link app-nav-link"
                href="{{ url_for('main.dashboard') }}"
            >
                Dashboard
            </a>


            <!-- Analysis -->

            <a
                class="nav-link app-nav-link"
                href="{{ url_for('main.analysis') }}"
            >
                Analysis
            </a>


            <!-- Crime Records -->

            <a
                class="nav-link app-nav-link"
                href="{{ url_for('main.crime_records') }}"
            >
                Crime Records
            </a>


            <!-- Data Quality -->

            <a
                class="nav-link app-nav-link"
                href="{{ url_for('main.data_quality') }}"
            >
                Data Quality
            </a>


            <!-- Reports -->

            <a
                class="nav-link app-nav-link"
                href="{{ url_for('main.reports') }}"
            >
                Reports
            </a>

        </div>

    </div>

</nav>


<!-- =====================================================
     Main Application Area
===================================================== -->

<main class="app-main">

    <div class="container py-4">


        <!-- =================================================
             Flash Messages
        ================================================== -->

        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ category }} app-alert"
                    role="alert"
                >

                    {{ message }}

                </div>

            {% endfor %}

        {% endwith %}


        <!-- =================================================
             Page Content
        ================================================== -->

        {% block content %}

        {% endblock %}


    </div>

</main>


<!-- =====================================================
     Footer
===================================================== -->

<footer class="app-footer">

    <div class="container text-center">

        <span>
            Chicago Crime Analytics
        </span>

    </div>

</footer>


</body>

</html>
